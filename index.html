<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cti-3d-building</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
    }

    main {
      max-width: 640px;
      width: 100%;
      padding: 48px 32px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.2rem;
      line-height: 1.6;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main>
    <h1>cti-3d-building</h1>
    <p>A 3D website about CTI building</p>
  </main>
</body>
</html>
